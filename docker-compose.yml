services:
  db:
    # pgvector/pgvector:pg18-trixie + pg_jieba, aligned with the cloud database
    build: ./docker/postgres
    image: akasha/postgres:pg18-jieba
    environment:
      POSTGRES_DB: akasha
      POSTGRES_USER: akasha
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
      # Match the cloud database locale; only applies when the volume is first initialized.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
volumes:
  db_data:
